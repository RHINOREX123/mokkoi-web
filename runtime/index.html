<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mokkoi Runtime POC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="https://fonts.gstatic.com/s/materialsymbolsoutlined/v332/kJEhBvYX7BgnkSrUwT8OhrdQw4oELdPIeeII9v6oFsI.woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0A0A1A; color: #fff; font-family: 'DM Sans', system-ui, sans-serif; }
      /* Belt-and-braces scroll-chain isolation: ScrollView/FlatList already set
         overscroll-behavior:contain per-instance. This catches any future scroll
         container we haven't built yet (e.g. raw View with overflow:auto from
         AI), so wheel/touch scroll never bubbles out of the iframe. */
      html, body { overscroll-behavior: none; }
      /* Hide scrollbars on Mokkoi scroll containers in Chromium/Safari.
         Pairs with inline scrollbarWidth:'none' (Firefox-only). */
      .mokkoi-screen-scroll::-webkit-scrollbar { display: none; }
      /* Pressed-state visual feedback for TouchableOpacity. Pre-Week-3 stand-in
         for real onPress feedback — gives users acknowledgment that a tap was
         registered without wiring real handlers. */
      .mokkoi-touchable:active { opacity: 0.7; }
      /* Click-feedback toast (Week 3 Day 1): fade in fast, hold, fade out.
         Lifetime in JS = 1400ms; this animation matches that. */
      @keyframes mokkoi-toast-fade {
        0%   { opacity: 0; transform: translate(-50%, 6px); }
        12%  { opacity: 1; transform: translate(-50%, 0); }
        78%  { opacity: 1; transform: translate(-50%, 0); }
        100% { opacity: 0; transform: translate(-50%, -2px); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- This HTML is a Vite build entry (declared in build.rollupOptions.input
         in vite.config.ts). In dev, @vitejs/plugin-react auto-injects the
         React Refresh preamble via the HTML transform; in production, vite
         build hashes + bundles main.tsx and rewrites the script src below to
         the emitted asset path. Both work without a manual preamble.
         An earlier version of this file lived in public/runtime/ and shipped
         a hand-rolled /@react-refresh import as a workaround for public/
         skipping HTML transforms — that was production-broken (the output
         referenced a dev-only virtual module + raw .tsx) and is what
         motivated the move out of public/ in Week 4 Day 1.5. -->
    <script type="module" src="/src/runtime/main.tsx"></script>
  </body>
</html>
