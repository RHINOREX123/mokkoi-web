    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <style>
      /* Hide scrollbars on Mokkoi scroll containers in Chromium/Safari.
         Pairs with inline scrollbarWidth:'none' (Firefox-only). */
      .mokkoi-screen-scroll::-webkit-scrollbar { display: none; }
      /* Chip-row: horizontal filter/segment row that must scroll, not wrap. */
      .mokkoi-chip-row::-webkit-scrollbar { display: none; }
      .mokkoi-chip-row > * { flex-shrink: 0 !important; }
      .mokkoi-chip-row span { white-space: nowrap; word-break: normal; }
      /* Pressed-state visual feedback for TouchableOpacity. Pre-Week-3 stand-in
         for real onPress feedback. */
      .mokkoi-touchable:active { opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev-only: snack-sdk (loaded transitively via InlineSnackPreview) reads
      // `process.env.NODE_ENV` at module init. Production builds statically
      // replace those references; the dev server doesn't, so without this shim
      // the entire app fails to mount in `vite dev` with "process is not defined".
      window.process = window.process || { env: { NODE_ENV: 'development' } };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
