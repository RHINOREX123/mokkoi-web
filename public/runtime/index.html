<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mokkoi Runtime POC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0A0A1A; color: #fff; font-family: 'DM Sans', system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- @vitejs/plugin-react preamble. Required because public/ files are served
         static (no HTML transform), so the preamble Vite normally injects is
         missing. Without this, any JSX-containing module errors with
         "@vitejs/plugin-react can't detect preamble". No-op in production. -->
    <script type="module">
      import RefreshRuntime from '/@react-refresh'
      RefreshRuntime.injectIntoGlobalHook(window)
      window.$RefreshReg$ = () => {}
      window.$RefreshSig$ = () => (type) => type
      window.__vite_plugin_react_preamble_installed__ = true
    </script>
    <script type="module" src="/src/runtime/main.tsx"></script>
  </body>
</html>
