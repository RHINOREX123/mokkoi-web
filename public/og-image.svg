<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#111127"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="phone-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid dots -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="0.8" fill="rgba(255,255,255,0.04)"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Logo -->
  <rect x="510" y="140" width="56" height="56" rx="14" fill="url(#accent)"/>
  <text x="538" y="178" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#fff" text-anchor="middle">M</text>
  <!-- Title -->
  <text x="600" y="250" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#f1f5f9" text-anchor="middle">Mokkoi</text>
  <!-- Tagline -->
  <text x="600" y="300" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" text-anchor="middle">AI Mobile Screen Designer</text>
  <!-- Phone frame mockup -->
  <rect x="500" y="340" width="90" height="160" rx="12" fill="none" stroke="rgba(99,102,241,0.3)" stroke-width="2"/>
  <rect x="508" y="350" width="74" height="140" rx="6" fill="url(#phone-bg)"/>
  <rect x="516" y="360" width="58" height="8" rx="2" fill="rgba(99,102,241,0.2)"/>
  <rect x="516" y="374" width="40" height="6" rx="2" fill="rgba(99,102,241,0.12)"/>
  <rect x="516" y="390" width="58" height="30" rx="4" fill="rgba(99,102,241,0.08)"/>
  <rect x="516" y="430" width="58" height="20" rx="4" fill="rgba(99,102,241,0.06)"/>
  <!-- Second phone -->
  <rect x="610" y="340" width="90" height="160" rx="12" fill="none" stroke="rgba(129,140,248,0.2)" stroke-width="2"/>
  <rect x="618" y="350" width="74" height="140" rx="6" fill="url(#phone-bg)"/>
  <rect x="626" y="360" width="58" height="8" rx="2" fill="rgba(129,140,248,0.2)"/>
  <rect x="626" y="374" width="30" height="6" rx="2" fill="rgba(129,140,248,0.12)"/>
  <rect x="626" y="390" width="58" height="40" rx="4" fill="rgba(129,140,248,0.08)"/>
  <rect x="626" y="440" width="58" height="12" rx="4" fill="rgba(129,140,248,0.06)"/>
  <!-- Bottom text -->
  <text x="600" y="545" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">mokkoi.com</text>
</svg>
