<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mokkoi · Voice Orb Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse at center, #111722 0%, #050608 100%);
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  .stage {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    position: relative;
  }

  .heading {
    text-align: center;
    opacity: 0.7;
  }
  .heading .eyebrow {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6ee7d4;
    margin-bottom: 6px;
  }
  .heading h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.3px;
    color: #cbd5e1;
  }

  /* ── ORB ──────────────────────────────────────────────────────── */
  .orb-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* expanding rings (audio-reactive) */
  .ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1px solid rgba(45, 212, 191, 0.4);
    opacity: 0;
    pointer-events: none;
    transform: scale(0.5);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  /* core orb */
  .orb {
    position: relative;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, rgba(110, 231, 212, 0.95), rgba(6, 182, 212, 0.85) 60%, rgba(8, 145, 178, 0.95) 100%);
    box-shadow:
      0 0 0 1px rgba(110, 231, 212, 0.35),
      0 0 30px rgba(45, 212, 191, 0.3),
      0 0 60px rgba(6, 182, 212, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      width 0.4s cubic-bezier(0.16, 1, 0.3, 1),
      height 0.4s cubic-bezier(0.16, 1, 0.3, 1),
      box-shadow 0.4s ease,
      background 0.4s ease;
  }

  .orb svg {
    width: 32px;
    height: 32px;
    stroke: white;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.95;
  }

  /* recording state */
  .stage.is-recording .orb {
    width: 132px;
    height: 132px;
    box-shadow:
      0 0 0 1px rgba(110, 231, 212, 0.7),
      0 0 60px rgba(45, 212, 191, 0.55),
      0 0 120px rgba(6, 182, 212, 0.35);
  }
  .stage.is-recording .orb svg {
    width: 44px;
    height: 44px;
  }

  /* breathing pulse always present */
  .orb::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(110, 231, 212, 0.18) 0%, transparent 70%);
    animation: breathe 2.6s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 0.9; transform: scale(1.1); }
  }
  .stage.is-recording .orb::before {
    animation-duration: 1.4s;
  }

  /* spinner for transcribe state */
  .spinner-ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: rgba(110, 231, 212, 0.95);
    border-right-color: rgba(110, 231, 212, 0.45);
    animation: spin 0.9s linear infinite;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .stage.is-transcribing .spinner-ring { opacity: 1; }
  .stage.is-transcribing .orb { width: 88px; height: 88px; }
  .stage.is-transcribing .orb::before { animation-play-state: paused; opacity: 0.5; }
  .stage.is-transcribing .orb svg { opacity: 0.45; }

  /* done flash */
  .stage.is-done .orb {
    background: radial-gradient(circle at 35% 35%, #6ee7d4, #2dd4bf 60%, #10b981 100%);
    box-shadow: 0 0 0 1px rgba(110, 231, 212, 0.9), 0 0 80px rgba(45, 212, 191, 0.7);
  }

  /* ── STATUS LABEL ─────────────────────────────────────────────── */
  .status {
    height: 20px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.2px;
    color: #94a3b8;
    transition: opacity 0.3s ease, color 0.3s ease;
  }
  .stage.is-recording .status { color: #6ee7d4; }
  .stage.is-transcribing .status { color: #6ee7d4; opacity: 0.85; }
  .stage.is-done .status { color: #34d399; }

  .dot {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    margin-right: 6px;
    vertical-align: middle;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0.3; }
    50%      { opacity: 1; }
  }

  /* ── HINT FOOTER ──────────────────────────────────────────────── */
  .hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: #475569;
    letter-spacing: 0.4px;
  }

  .toast {
    position: absolute;
    top: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(220, 38, 38, 0.18);
    border: 1px solid rgba(220, 38, 38, 0.4);
    color: #fecaca;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="heading">
    <div class="eyebrow">Mokkoi · Voice</div>
    <h1>Tap the orb and speak</h1>
  </div>

  <div class="orb-wrap" id="orbWrap" tabindex="0" aria-label="Voice input">
    <div class="ring" id="ring1"></div>
    <div class="ring" id="ring2"></div>
    <div class="ring" id="ring3"></div>
    <div class="spinner-ring"></div>
    <div class="orb" id="orb">
      <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="23" /><line x1="8" y1="23" x2="16" y2="23" /></svg>
    </div>
  </div>

  <div class="status" id="status">Tap to start</div>

  <div class="toast" id="toast"></div>

  <div class="hint">Demo: silence auto-stops after 2s · transcription is simulated · Esc to reset</div>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const orbWrap = document.getElementById('orbWrap');
  const orb = document.getElementById('orb');
  const status = document.getElementById('status');
  const toast = document.getElementById('toast');
  const rings = [
    document.getElementById('ring1'),
    document.getElementById('ring2'),
    document.getElementById('ring3'),
  ];

  let mediaStream = null;
  let audioCtx = null;
  let analyser = null;
  let dataArr = null;
  let rafId = null;
  let silenceStart = 0;
  const SILENCE_THRESHOLD = 0.025; // normalized [0..1] — anything below this counts as quiet
  const SILENCE_HOLD_MS = 2000;
  let inFlight = false;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function setState(state) {
    stage.classList.remove('is-recording', 'is-transcribing', 'is-done');
    if (state) stage.classList.add(state);
  }

  function setStatus(html) {
    status.innerHTML = html;
  }

  async function start() {
    if (inFlight) return;
    inFlight = true;
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      inFlight = false;
      showToast('Microphone access denied. Allow it in your browser settings.');
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.8;
    src.connect(analyser);
    dataArr = new Uint8Array(analyser.frequencyBinCount);

    setState('is-recording');
    setStatus('<span class="dot"></span>Listening');
    silenceStart = 0;
    loop();
  }

  function loop() {
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArr);
    let sum = 0;
    for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
    const avg = (sum / dataArr.length) / 255; // normalized 0..1

    // Drive orb size + ring intensity from audio level.
    const scale = 1 + avg * 0.28;
    orb.style.transform = `scale(${scale.toFixed(3)})`;
    const ringStrength = Math.min(avg * 3, 1);
    rings.forEach((r, idx) => {
      const phase = (idx + 1) / rings.length;
      r.style.opacity = (ringStrength * (0.7 - idx * 0.18)).toFixed(2);
      r.style.transform = `scale(${(0.55 + ringStrength * 0.55 * phase + idx * 0.05).toFixed(3)})`;
    });

    // Silence detection.
    const now = performance.now();
    if (avg < SILENCE_THRESHOLD) {
      if (silenceStart === 0) silenceStart = now;
      const heldFor = now - silenceStart;
      if (heldFor > SILENCE_HOLD_MS) {
        stop();
        return;
      }
    } else {
      silenceStart = 0;
    }

    rafId = requestAnimationFrame(loop);
  }

  async function stop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    setState('is-transcribing');
    setStatus('Transcribing');

    // Reset orb scale.
    orb.style.transform = '';
    rings.forEach(r => { r.style.opacity = '0'; r.style.transform = 'scale(0.5)'; });

    // Stop the mic.
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
    if (audioCtx) {
      try { await audioCtx.close(); } catch {}
      audioCtx = null;
    }

    // Simulate transcription latency.
    await new Promise(r => setTimeout(r, 1200));

    // Done flash, then idle.
    setState('is-done');
    setStatus('Sending to Mokkoi');
    await new Promise(r => setTimeout(r, 700));
    setState(null);
    setStatus('Tap to start');
    inFlight = false;
  }

  function reset() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (mediaStream) {
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
    }
    if (audioCtx) {
      try { audioCtx.close(); } catch {}
      audioCtx = null;
    }
    orb.style.transform = '';
    rings.forEach(r => { r.style.opacity = '0'; r.style.transform = 'scale(0.5)'; });
    setState(null);
    setStatus('Tap to start');
    inFlight = false;
  }

  orbWrap.addEventListener('click', () => {
    if (stage.classList.contains('is-recording')) {
      stop();
    } else if (!stage.classList.contains('is-transcribing') && !stage.classList.contains('is-done')) {
      start();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') reset();
  });
})();
</script>
</body>
</html>
