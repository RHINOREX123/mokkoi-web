# Mokkoi X-ray report runner: picks up paid ("queued") Quick X-ray orders and runs the
# report engine. Scheduled workflows only run from the default branch, so this starts
# working once merged to main and the secrets below are set.
name: xray-runner

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      order:
        description: 'Run one order id (optional; default = all queued)'
        required: false

concurrency:
  group: xray-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
      XRAY_REQUIRE_SUPABASE: '1'
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "X-ray runner secrets are not set yet; nothing to do."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        if: steps.cfg.outputs.ready == 'true'
      - name: Run queued Quick X-rays
        if: steps.cfg.outputs.ready == 'true'
        env:
          ORDER_ID: ${{ github.event.inputs.order }}
        run: |
          if [ -n "$ORDER_ID" ]; then
            npx tsx worker/run.ts --order "$ORDER_ID"
          else
            npx tsx worker/run.ts --queued --max 3
          fi
